<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
    "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<!--
  catbsd-init.conf — boot configuration for catbsd-init

  Read at startup before any daemons are loaded.  All keys are optional;
  the defaults shown here are used when a key is absent.

  Override any key with an environment variable of the same name prefixed
  with CATBSD_INIT_:
      CATBSD_INIT_SINGLE_USER=1 ./catbsd-init
      CATBSD_INIT_DAEMON_DIR=/var/catbsd/daemons ./catbsd-init
-->
<plist version="1.0">
<dict>

    <!--
      DaemonDirectory
      Directory scanned for *.plist job definitions at boot.
      All plists with RunAtLoad=true are started automatically.
    -->
    <key>DaemonDirectory</key>
    <string>/etc/catbsd/daemons</string>

    <!--
      ControlSocket
      AF_UNIX socket path for the launchctl control channel.
      Overrides the XPC shim's runtime-directory resolution.
      Leave empty to use the shim default
      ($CATBSD_XPC_RUNTIME_DIR/com.catbsd.launchd).
    -->
    <key>ControlSocket</key>
    <string></string>

    <!--
      SingleUser
      If true, skip the daemon directory and control socket and drop
      directly to a root shell.  Equivalent to CATBSD_INIT_SINGLE_USER=1.
    -->
    <key>SingleUser</key>
    <false/>

    <!--
      SingleUserShell
      Shell invoked in single-user mode.
    -->
    <key>SingleUserShell</key>
    <string>/bin/sh</string>

    <!--
      ShutdownTimeoutMs
      Milliseconds to wait for each job to exit gracefully on SIGTERM
      before escalating to SIGKILL.
    -->
    <key>ShutdownTimeoutMs</key>
    <integer>5000</integer>

    <!--
      LogLevel
      Verbosity: 0=quiet, 1=normal, 2=verbose, 3=debug
    -->
    <key>LogLevel</key>
    <integer>1</integer>

</dict>
</plist>
